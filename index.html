<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLOV_AUTH_TERMINAL_V5.5</title>
    <style>
        :root {
            --klov-red: #ff1744;
            --tomato-green: #00ff41;
            --bg-color: #030303;
            --terminal-border: rgba(0, 255, 65, 0.1);
            --klov-gold: #c5a059;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.1;
        }

        /* 全域右下角番茄標記 - 初始完全隱藏 */
        .tomato-watermark {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 100px;
            opacity: 0;
            /* 破解前不可見 */
            filter: grayscale(0%) drop-shadow(0 0 15px var(--klov-red));
            transition: opacity 1s ease-in-out;
            z-index: 9999;
            pointer-events: none;
        }

        /* 破解中啟動顯示與動畫 */
        .tomato-watermark.hacked {
            opacity: 0.95;
            animation: watermark-blink 1.2s infinite;
        }

        @keyframes watermark-blink {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* 掃描線層 */
        body::after {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        #auth-shell,
        #warning-letter {
            width: 92%;
            max-width: 480px;
            padding: 45px 30px;
            background: rgba(5, 5, 5, 0.98);
            border: 1px solid var(--terminal-border);
            text-align: center;
            z-index: 10;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
        }

        #warning-letter {
            max-width: 600px;
            border-color: var(--klov-red);
            display: none;
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid var(--tomato-green);
            opacity: 0.4;
        }

        #warning-letter .corner {
            border-color: var(--klov-red);
        }

        .c-tl {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .c-tr {
            top: -1px;
            right: -1px;
            border-left: 0;
            border-bottom: 0;
        }

        .c-bl {
            bottom: -1px;
            left: -1px;
            border-right: 0;
            border-top: 0;
        }

        .c-br {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        /* 駭客控制台介面 */
        #hack-progress-container {
            display: none;
            text-align: left;
            margin-top: 25px;
        }

        #hack-log {
            height: 140px;
            overflow: hidden;
            color: var(--tomato-green);
            margin-bottom: 15px;
            border-left: 3px solid var(--tomato-green);
            padding-left: 15px;
            font-size: 12pt;
            font-weight: bold;
            line-height: 1.5;
            background: rgba(0, 255, 65, 0.03);
        }

        #progress-bar-wrapper {
            width: 100%;
            height: 28px;
            border: 2px solid var(--tomato-green);
            position: relative;
            background: #000;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--tomato-green);
            transition: width 0.1s;
            box-shadow: 0 0 20px var(--tomato-green);
        }

        #progress-percent {
            margin-top: 10px;
            color: var(--tomato-green);
            font-size: 16pt;
            font-weight: bold;
            text-align: right;
        }

        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .disc-logo {
            position: absolute;
            width: 80%;
            height: 80%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.8s;
            filter: grayscale(100%) brightness(0.6);
        }

        .disc-logo.active {
            opacity: 1;
        }

        .hacker-main-logo {
            position: absolute;
            width: 85%;
            opacity: 0;
            filter: grayscale(100%) brightness(1.2) sepia(100%) hue-rotate(330deg) saturate(800%) drop-shadow(0 0 15px var(--klov-red));
            mix-blend-mode: screen;
            transition: opacity 0.5s;
            z-index: 5;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 8pt;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: var(--tomato-green);
            padding: 15px;
            font-family: monospace;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--tomato-green);
            color: var(--tomato-green);
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 5px;
            transition: 0.3s;
        }

        .auth-btn:hover:not(:disabled) {
            background: var(--tomato-green);
            color: #000;
        }

        .type-line {
            opacity: 0;
            margin-bottom: 12px;
            line-height: 1.6;
            border-left: 2px solid transparent;
            padding-left: 10px;
            text-align: left;
        }

        .type-line.visible {
            opacity: 1;
            border-left-color: var(--klov-red);
            transition: opacity 0.5s;
        }

        .highlight {
            color: var(--klov-red);
            font-weight: bold;
            text-shadow: 0 0 10px var(--klov-red);
        }

        /* 特效類 */
        .shake {
            animation: shake 0.12s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 1px);
            }

            50% {
                transform: translate(-2px, -1px);
            }

            100% {
                transform: translate(1px, 2px);
            }
        }

        .emergency-blink {
            animation: alert-bg 0.5s infinite;
        }

        @keyframes alert-bg {

            0%,
            100% {
                background-color: #030303;
            }

            50% {
                background-color: #2a0000;
            }
        }

        #noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWU0WMrQmXD6wS/giphy.gif');
            opacity: 0.03;
            pointer-events: none;
            z-index: 999;
            display: none;
        }

        .wipe-out {
            animation: wipe 1.2s forwards cubic-bezier(0.8, 0, 0.2, 1);
        }

        @keyframes wipe {
            0% {
                transform: scaleY(1);
                opacity: 1;
            }

            30% {
                transform: scaleY(0.005) scaleX(1.1);
                opacity: 0.8;
                filter: brightness(10);
            }

            100% {
                transform: scaleY(0.005) scaleX(0);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <img src="hacker_tomato_agent_transparent.png" class="tomato-watermark" id="global-tomato">

    <div id="auth-shell">
        <div class="corner c-tl"></div>
        <div class="corner c-tr"></div>
        <div class="corner c-bl"></div>
        <div class="corner c-br"></div>
        <div class="sys-header" style="font-size: 8pt; color: #444; text-align: left; margin-bottom: 20px;">KLOV_GATE //
            TRI-COUNCIL_AUTH</div>

        <div class="logo-container">
            <img src="WALTER.png" class="disc-logo active" id="logo-w">
            <img src="EDWARD.png" class="disc-logo" id="logo-e">
            <img src="MORGAN.png" class="disc-logo" id="logo-m">
            <img src="hacker_tomato_agent.png" class="hacker-main-logo" id="center-tomato">
        </div>

        <div id="login-form">
            <div class="input-group">
                <label>ACCESS_IDENTIFIER</label>
                <input type="text" id="user-id" placeholder="EMPLOYEE_ID">
            </div>
            <div class="input-group">
                <label>SECURITY_PASSKEY</label>
                <input type="password" id="pass-key" placeholder="••••••••">
            </div>
            <button class="auth-btn" id="main-btn" onclick="normalAuth()">Initialize Auth</button>
            <div id="status-msg" style="margin-top:20px; font-size: 8pt; color: #444;">[等待驗證指令]</div>
        </div>

        <div id="hack-progress-container">
            <div id="hack-log"></div>
            <div id="progress-bar-wrapper">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="progress-percent">0%</div>
        </div>
    </div>

    <div id="warning-letter">
        <div class="corner c-tl"></div>
        <div class="corner c-tr"></div>
        <div class="corner c-bl"></div>
        <div class="corner c-br"></div>
        <div
            style="color: var(--klov-red); font-size: 18pt; font-weight: bold; margin-bottom: 30px; text-align: center; letter-spacing: 5px;">
            TERMINATION NOTICE</div>
        <div id="text-container">
            <div class="type-line">發送單位：<span class="highlight">克洛夫集團 - 網絡監控與電子對抗組</span></div>
            <div class="type-line">授權代號： KLOV-SIG-TERMINATE-2026</div>
            <div class="type-line">目標狀態： <span class="highlight">已鎖定（LOCKED）__</span></div>
            <div class="type-line" style="color: #666; margin-top: 15px;">[系統警告] 偵測到未經授權的外部滲透</div>
            <div class="type-line">致訪問者：</div>
            <div class="type-line">你成功穿透了我們的外部防火牆。這是一個令人印象深刻的技術展現，但也是你人生中<span class="highlight">最後一個錯誤選擇</span>。</div>
            <div class="type-line">在你閱讀這行文字的同時，我們已經找到你了。</div>
            <div class="type-line"
                style="color: var(--klov-gold); font-style: italic; background: rgba(197, 160, 89, 0.05); padding: 15px; margin: 15px 0; border: none;">
                「秩序源於力量，而力量不容挑釁。」 —— 三頭議會</div>
            <div class="type-line" style="text-align: right; margin-top: 25px; border: none;">
                <span style="font-weight: bold; color: #eee;">三頭議會聯名發布</span><br>
                <span style="font-size: 9pt; color: #555;">沃爾特家族 | 愛德華家族 | 摩根家族</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let isHacked = false;
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = "0123456789ABCDEF";
        const drops = Array(Math.floor(canvas.width / 16)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = isHacked ? "#ff0000" : "#00ff41"; ctx.font = "16px monospace";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * 16, y * 16);
                if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);

        let currentLogoIdx = 0;
        const familyLogos = [document.getElementById('logo-w'), document.getElementById('logo-e'), document.getElementById('logo-m')];
        let logoRotation = setInterval(() => {
            if (!isHacked) {
                familyLogos[currentLogoIdx].classList.remove('active');
                currentLogoIdx = (currentLogoIdx + 1) % familyLogos.length;
                familyLogos[currentLogoIdx].classList.add('active');
            }
        }, 3000);

        let loginAttempts = 0;
        function normalAuth() {
            const msg = document.getElementById('status-msg');
            const btn = document.getElementById('main-btn');
            if (loginAttempts >= 3) return;
            btn.disabled = true; msg.innerText = "> 連線中...";
            setTimeout(() => {
                loginAttempts++; btn.disabled = false;
                document.getElementById('auth-shell').classList.add('shake');
                setTimeout(() => document.getElementById('auth-shell').classList.remove('shake'), 500);
                document.getElementById('pass-key').classList.add('input-error');
                setTimeout(() => document.getElementById('pass-key').classList.remove('input-error'), 500);
                if (loginAttempts < 3) {
                    msg.innerText = `> [登入失敗] 憑證無效。剩餘嘗試：${3 - loginAttempts}`;
                    msg.style.color = "var(--klov-red)";
                } else {
                    btn.disabled = true; btn.innerText = "TERMINATED";
                    msg.innerHTML = `<span style="color: var(--klov-red); font-weight: bold;">> [警報] 偵測到暴力破解，位置已追蹤。</span>`;
                    document.body.classList.add('emergency-blink');
                    document.getElementById('noise-overlay').style.display = 'block';
                }
            }, 1000);
        }

        const hackLogs = [
            "Initializing brute-force bypass...",
            "Connecting to Proxy: 12.97.1.1",
            "Bypassing KLOV_Gate Firewall...",
            "Injecting SQL-Injection payload...",
            "Accessing Walter Family Mainframe...",
            "Scanning for security vulnerabilities...",
            "Buffer overflow detected. Exploiting...",
            "Retrieving Tri-Council encrypted keys...",
            "Decrypting Morgan's database...",
            "Compiling root-kit...",
            "Finalizing system override..."
        ];

        function startHack() {
            if (document.getElementById('warning-letter').style.display === "block") return;
            isHacked = true;
            clearInterval(logoRotation);

            document.getElementById('login-form').style.display = "none";
            document.getElementById('hack-progress-container').style.display = "block";
            document.getElementById('center-tomato').style.opacity = "1";

            // --- 核心修改：此時才顯現並啟動右下角番茄標記 ---
            const globalTomato = document.getElementById('global-tomato');
            globalTomato.classList.add('hacked');

            familyLogos.forEach(l => l.classList.remove('active'));

            let progress = 0;
            const logEl = document.getElementById('hack-log');
            const barFill = document.getElementById('progress-bar-fill');
            const percentEl = document.getElementById('progress-percent');

            let logIdx = 0;
            const logInterval = setInterval(() => {
                if (logIdx < hackLogs.length) {
                    const line = document.createElement('div');
                    line.innerText = `> ${hackLogs[logIdx]}`;
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                    logIdx++;
                }
            }, 450);

            const progressInterval = setInterval(() => {
                progress += Math.random() * 2.5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);
                    clearInterval(logInterval);
                    setTimeout(() => {
                        document.getElementById('auth-shell').style.display = "none";
                        document.getElementById('warning-letter').style.display = "block";
                        showLines();
                    }, 1000);
                }
                barFill.style.width = progress + "%";
                percentEl.innerText = Math.floor(progress) + "%";
            }, 120);
        }

        function showLines() {
            const lines = document.querySelectorAll('.type-line');
            lines.forEach((line, index) => {
                setTimeout(() => {
                    line.classList.add('visible');
                    if (index === lines.length - 1) setTimeout(autoClose, 10000);
                }, index * 900);
            });
        }

        function autoClose() {
            const letter = document.getElementById('warning-letter');
            const tomato = document.getElementById('global-tomato');
            document.title = "CRITICAL_FAILURE";

            letter.classList.add('wipe-out');
            if (tomato) tomato.style.opacity = "0";

            setTimeout(() => {
                document.body.innerHTML = `<div style="background:#000; color:#1a1a1a; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; font-family:monospace; font-size:10pt; letter-spacing:5px;">NO_SIGNAL_DETECTED</div>`;
            }, 1200);
        }
    </script>
</body>

</html>
